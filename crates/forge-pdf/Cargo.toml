[package]
name = "forge-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
thiserror.workspace = true
printpdf.workspace = true
# Page ops (split/count/extract) need printpdf's engine directly (ADR 009):
# printpdf 0.12 already depends on lopdf 0.44 — no new native code.
lopdf.workspace = true
# PDF → .docx writer (pure-Rust OOXML, builder API; see dep table in PLAN.md).
docx-rs.workspace = true
# PDF → image renderer (pure-Rust hayro CPU rasterizer; replaces the stub).
hayro.workspace = true

[dev-dependencies]
# OOXML content assertions (unzip word/document.xml in tests only).
zip = "2"
