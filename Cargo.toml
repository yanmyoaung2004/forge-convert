[workspace]
resolver = "2"
members = ["apps/cli", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Pinned per docs/PLAN.md dep-justification table.
# Members adopt these phase by phase; do not add ad-hoc versions.
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
webp = "0.3"
printpdf = { version = "0.12", default-features = false, features = ["images"] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
