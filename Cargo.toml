[workspace]
resolver = "2"
members = ["apps/cli", "apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
[workspace.dependencies]
# Pinned per docs/PLAN.md dep-justification table.
# Members adopt these phase by phase; do not add ad-hoc versions.
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "ico"] }
webp = "0.3"
printpdf = { version = "0.12", default-features = false, features = ["images"] }
kamadak-exif = "0.6"
lopdf = { version = "0.44", default-features = false }
docx-rs = { version = "0.4" }
# PDF → image render (hayro 0.6 CPU rasterizer, pure-Rust, Apache-2.0 OR MIT;
# 0.8 needs rustc 1.92 > workspace MSRV 1.88, so pin 0.6).
hayro = { version = "0.6" }
qrcode = { version = "0.14", default-features = false, features = ["image", "svg"] }
# QR decode (`rqrr`, pure-Rust, MIT/Apache/ISC; first-grid-wins).
rqrr = { version = "0.11" }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11" }
tauri-plugin-dialog = { version = "2.7" }
tauri-plugin-opener = { version = "2.5" }
